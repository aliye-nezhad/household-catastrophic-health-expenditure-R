name: Household health expenditure in R

on:
  push:
    branches: [main, "audit/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-reproducibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    name: Run the household survey analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Pixi 0.84.2
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/pixi-bin"
          mkdir -p "$bin"
          archive="$RUNNER_TEMP/pixi.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            --output "$archive" \
            https://github.com/prefix-dev/pixi/releases/download/v0.84.2/pixi-x86_64-unknown-linux-musl.tar.gz
          printf '%s  %s\n' \
            6d2a576bde0a7b26533a068fec0aea6e4ee21c36668efc1dc73fce90110906ae \
            "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$bin"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Run the analysis with Pixi
        run: pixi run --locked reproduce

      - name: Save the result files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: household-che-research-outputs
          path: reproduced/run-*/
          if-no-files-found: error
          retention-days: 30
