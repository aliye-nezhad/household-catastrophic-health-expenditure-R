name: R reproducibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest run for a given branch. This prevents repeated
# commits from leaving several identical dependency-install jobs running.
concurrency:
  group: r-reproducibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    name: Run household CHE analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      - name: Install system libraries required by R packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            7zip \
            mdbtools \
            pandoc \
            libuv1-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libcairo2-dev \
            libpng-dev \
            libjpeg-dev \
            libtiff-dev \
            libwebp-dev \
            libxml2-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxt-dev

          pandoc --version
          if command -v 7zz >/dev/null 2>&1; then
            7zz --help >/dev/null
          elif command -v 7z >/dev/null 2>&1; then
            7z --help >/dev/null
          else
            dpkg -L 7zip
            exit 1
          fi

      - name: Extract required household Excel files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/processed outputs/diagnostics

          if command -v 7zz >/dev/null 2>&1; then
            SEVEN_ZIP="$(command -v 7zz)"
          else
            SEVEN_ZIP="$(command -v 7z)"
          fi

          "$SEVEN_ZIP" x data/raw/R93.rar -odata/processed -y
          "$SEVEN_ZIP" x data/raw/U93.rar -odata/processed -y

          test -s data/processed/R93.xls
          test -s data/processed/U93.xls

          echo "=== Inventory of the additional 1393 archive ==="
          "$SEVEN_ZIP" l data/raw/93.rar > outputs/diagnostics/93_archive_inventory.txt
          cat outputs/diagnostics/93_archive_inventory.txt

      - name: Inventory original Access database schema (no record export)
        run: bash code/audit_access_database.sh

      - name: Install R dependencies (cached)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::dplyr any::readxl any::writexl any::modelsummary any::labelled any::survey any::ggplot2 any::flextable any::officer any::pandoc
          dependencies: '"hard"'
          cache: always

      - name: Verify Pandoc
        run: |
          command -v pandoc
          pandoc --version

      - name: Audit source-data coverage and survey identifiers
        run: Rscript code/audit_source_data.R

      - name: Run full analysis and validate outputs
        run: Rscript code/Health_Expenditure_Analysis.R

      - name: Upload generated research outputs
        uses: actions/upload-artifact@v4
        with:
          name: household-che-research-outputs
          path: outputs/
          if-no-files-found: error
          retention-days: 30
