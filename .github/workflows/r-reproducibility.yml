name: R reproducibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest run for a given branch. This prevents repeated
# commits from leaving several identical dependency-install jobs running.
concurrency:
  group: r-reproducibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    name: Run household CHE analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      - name: Install system libraries required by R packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            7zip \
            pandoc \
            libuv1-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libcairo2-dev \
            libpng-dev \
            libjpeg-dev \
            libtiff-dev \
            libwebp-dev \
            libxml2-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxt-dev

          pandoc --version
          if command -v 7zz >/dev/null 2>&1; then
            7zz --help >/dev/null
          elif command -v 7z >/dev/null 2>&1; then
            7z --help >/dev/null
          else
            dpkg -L 7zip
            exit 1
          fi

      - name: Extract required household Excel files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/processed

          if command -v 7zz >/dev/null 2>&1; then
            SEVEN_ZIP="$(command -v 7zz)"
          else
            SEVEN_ZIP="$(command -v 7z)"
          fi

          "$SEVEN_ZIP" x data/raw/R93.rar -odata/processed -y
          "$SEVEN_ZIP" x data/raw/U93.rar -odata/processed -y

          test -s data/processed/R93.xls
          test -s data/processed/U93.xls

      - name: Install R dependencies
        shell: Rscript {0}
        run: |
          packages <- c(
            "dplyr",
            "readxl",
            "openxlsx",
            "modelsummary",
            "labelled",
            "survey",
            "ggplot2",
            "flextable",
            "officer",
            "pandoc"
          )

          missing <- packages[
            !vapply(packages, requireNamespace, logical(1), quietly = TRUE)
          ]

          if (length(missing) > 0) {
            message("Installing missing R packages: ", paste(missing, collapse = ", "))
            # setup-r configures the public Posit Package Manager repository.
            # Keeping its repository setting allows Linux binary packages to
            # be used where available, while the system libraries above
            # support source builds when needed.
            install.packages(missing)
          }

          unavailable <- packages[
            !vapply(packages, requireNamespace, logical(1), quietly = TRUE)
          ]

          if (length(unavailable) > 0) {
            stop(
              "Required R packages remain unavailable: ",
              paste(unavailable, collapse = ", ")
            )
          }

          if (!nzchar(Sys.which("pandoc"))) {
            stop("The system Pandoc executable is not available on PATH.")
          }

          system2("pandoc", "--version")

      - name: Run full analysis and validate outputs
        run: Rscript code/Health_Expenditure_Analysis.R

      - name: Upload generated research outputs
        uses: actions/upload-artifact@v4
        with:
          name: household-che-research-outputs
          path: outputs/
          if-no-files-found: error
          retention-days: 30
